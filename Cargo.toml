[package]
name = "kwms"
version = "0.1.0"
edition = "2021"
description = "WM(T)S server for aerial imagery"
license = "MIT OR Apache-2.0"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# http
axum = "0.7"
# Served with hyper's HTTP/1 connection builder directly (timeouts,
# connection cap); kwms runs behind a TLS-terminating proxy, never h2/h2c.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.5", features = ["trace", "catch-panic"] }

# serde
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
schemars = "0.8"

# gdal / geo
gdal = "0.17"
# Direct FFI for GDAL APIs the safe crate does not wrap (GDALWarp,
# OSRFindMatches, axis mapping). Must stay on the version `gdal` uses.
gdal-sys = "0.10"
crossbeam-channel = "0.5"

# storage / cache
# Persistent tile cache. Backends are compiled in per opendal feature:
# `fs` for local/testing, `azblob` for Azure Blob Storage in production.
opendal = { version = "0.59", features = ["services-fs", "services-azblob"] }
moka = { version = "0.12", features = ["future"] }

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# cli
clap = { version = "4", features = ["derive"] }

# utils
bytes = "1"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
humantime-serde = "1"
bytesize = { version = "1", features = ["serde"] }
quick-xml = { version = "0.42", features = ["serialize"] }
percent-encoding = "2"
# Random request ids.
getrandom = "0.3"

# kwms-bench (src/bench/kwms-bench.rs) only: `cargo run --release --features bench --bin kwms-bench`.
ureq = { version = "3", optional = true }
roxmltree = { version = "0.20", optional = true }

[features]
# Generate GDAL bindings at build time (needed for GDAL versions newer than
# gdal-sys's prebuilt bindings, e.g. 3.11): `cargo test --features bindgen`.
bindgen = ["gdal/bindgen"]
# The benchmark client (HTTP + XML parsing), kept out of the server build.
bench = ["dep:ureq", "dep:roxmltree"]

[[bin]]
name = "kwms-bench"
path = "src/bench/kwms-bench.rs"
required-features = ["bench"]

[lints.rust]
# `cfg(fuzzing)` is set by cargo-fuzz; see fuzz/ and protocol::fuzz_harness.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
# Panic on integer overflow instead of silently wrapping (debug/test builds
# already do). A panic in a handler becomes a 500 via CatchPanicLayer.
overflow-checks = true
